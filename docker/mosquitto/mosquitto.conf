# =============================================================================
# mosquitto.conf — Eclipse Mosquitto 2.x Broker Configuration
# Project : Smart IoT Based Water & Electricity Monitoring
# Purpose : Development broker — no TLS, no authentication
#
# IMPORTANT: This configuration is intentionally permissive for local
# development. Before deploying to any shared or production environment you
# MUST enable authentication (password_file) and TLS (cafile / certfile /
# keyfile) and set allow_anonymous to false.
#
# Documentation: https://mosquitto.org/man/mosquitto-conf-5.html
# =============================================================================


# -----------------------------------------------------------------------------
# Listener 1 — Standard MQTT over TCP (port 1883)
# Used by:
#   • ESP32 firmware (Arduino/PlatformIO MQTT client)
#   • Node.js backend (npm package: mqtt)
# -----------------------------------------------------------------------------

# Bind the broker to port 1883 on all available network interfaces (0.0.0.0).
# To restrict to a specific interface, add the IP: listener 1883 127.0.0.1
listener 1883

# Allow clients to connect without providing a username or password.
# Set to false in production and pair with password_file for basic auth,
# or with plugin auth_plugin for OAuth / JWT authentication.
allow_anonymous true


# -----------------------------------------------------------------------------
# Listener 2 — MQTT over WebSockets (port 9001)
# Used by:
#   • Browser-based MQTT clients (e.g., mqtt.js loaded in a web page)
#   • Debugging tools such as MQTT Explorer (WebSocket mode)
# This listener is optional — comment it out if no browser clients are needed.
# -----------------------------------------------------------------------------

# Bind a second listener on port 9001 for WebSocket connections.
listener 9001

# Tell Mosquitto to speak the WebSocket sub-protocol on this listener.
# Without this directive, the port would accept raw TCP MQTT, not WebSockets.
protocol websockets

# Permit anonymous clients on the WebSocket listener as well.
allow_anonymous true


# -----------------------------------------------------------------------------
# Message Persistence
# Persistence allows retained messages, QoS 1, and QoS 2 queues to survive
# a broker restart. Without this, all in-flight state is lost on shutdown.
# -----------------------------------------------------------------------------

# Enable persistence. When true, Mosquitto writes its state to disk at the
# path defined by persistence_location.
persistence true

# Directory where Mosquitto stores the persistence database file (mosquitto.db).
# Inside Docker this path resolves to the mosquitto_data named volume.
persistence_location /mosquitto/data/


# -----------------------------------------------------------------------------
# Logging
# Mosquitto supports multiple simultaneous log destinations: stdout, file,
# syslog, and topic. During development, logging to a file makes it easy
# to review broker activity across container restarts.
# -----------------------------------------------------------------------------

# Write log output to the specified file.
# Inside Docker this path resolves to the mosquitto_log named volume.
# To also echo logs to stdout (useful for `docker compose logs`), add:
#   log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

# Log all event types. Individual types can be listed instead of 'all':
#   debug     — Very verbose, includes internal state transitions
#   error     — Fatal or non-recoverable conditions
#   warning   — Non-fatal issues worth investigating
#   notice    — Significant events (client connect / disconnect, subscriptions)
#   information — General informational messages
#   subscribe — Every SUBSCRIBE and UNSUBSCRIBE operation
#   unsubscribe
#   websocket — WebSocket-specific events (only relevant for WS listeners)
#   none      — Disables all logging
log_type all

# Prepend an ISO-8601 timestamp to every log line.
# Format: 1706789012: Client esp32-01 disconnected.
# Set to false if your log aggregator (e.g., Loki, Fluentd) adds its own timestamps.
log_timestamp true
